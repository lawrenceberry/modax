name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a push mid-run queues rather than cancelling, so
# main always ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # Sphinx's newest releases need 3.13.
          python-version: "3.13"
      - name: Install the package and the docs toolchain
        # autodoc imports modax, so the project and its CPU dependencies come
        # too; the dev group's baselines do not. No GPU is needed to import.
        run: uv sync --frozen --no-default-groups --group docs
      - name: Build the site
        # -W: a warning (a broken reference, a missing include) fails the build.
        run: uv run --no-sync sphinx-build -W --keep-going docs docs/_build/html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
