name: lint

# ruff's formatting and lint checks. Its own workflow rather than a job in
# `tests.yml` because GitHub renders a status badge per workflow: this is what
# the "lint" badge in the README reports. Type checking is `types.yml`, for the
# same reason. Nothing here needs a GPU or the CUDA toolchain.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a ruff release cannot turn main red on its own. Keep in step
  # with the `rev` in .pre-commit-config.yaml and the floor in pyproject.toml.
  RUFF_VERSION: "0.15.5"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Formatting
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check --diff .
      - name: Lint
        # `--output-format=github` turns each finding into an annotation on the
        # offending line rather than a line of log to go hunting through.
        run: uvx ruff@${{ env.RUFF_VERSION }} check --output-format=github .
